<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relationship Closeness Inventory</title>
    
    <!-- Load Tailwind CSS directly in the browser -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Load React and ReactDOM from CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Load Babel to compile JSX syntax in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Load Recharts and its dependencies -->
    <script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>

    <style>
        /* Custom animations previously handled by tailwind config */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInFromBottom { from { transform: translateY(1rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        
        .animate-in { animation-duration: 0.5s; animation-fill-mode: both; }
        .fade-in { animation-name: fadeIn; }
        .slide-in-from-bottom-4 { animation-name: slideInFromBottom; }
        .zoom-in-95 { animation-name: zoomIn; animation-duration: 0.7s; }
        .shake { animation-name: shake; animation-duration: 0.4s; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div id="root"></div>

    <!-- The actual React Application -->
    <script type="text/babel">
        // Extract hooks and components from the global React and Recharts objects
        const { useState, useEffect } = React;
        const { Radar, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, ResponsiveContainer, Tooltip } = window.Recharts;

        // --- INLINE SVG ICONS (Replacing lucide-react for the standalone version) ---
        const IconActivity = ({ size = 24, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>;
        const IconClock = ({ size = 24, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const IconCheckSquare = ({ size = 24, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>;
        const IconMap = ({ size = 24, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>;
        const IconChevronRight = ({ size = 24, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"/></svg>;
        const IconChevronLeft = ({ size = 24, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="15 18 9 12 15 6"/></svg>;
        const IconBarChart2 = ({ size = 24, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>;
        const IconShieldAlert = ({ size = 24, className = "" }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;

        // --- DATA STRUCTURES & CONSTANTS ---
        const ACTIVITIES = [
          "did laundry", "talked on the phone", "prepared a meal", "went to a movie",
          "watched TV", "ate a meal", "went to an auction/antique show", "participated in a sporting activity",
          "attended a non-class lecture or presentation", "outdoor recreation (e.g., sailing)",
          "went to a restaurant", "went to a play", "went to a grocery store", "went to a bar",
          "went for a walk/drive", "visited family", "discussed things of a personal nature",
          "visited friends", "went to a museum/art show", "went to a department, book, hardware store, etc.",
          "planned a party/social event", "played cards/board game", "attended class",
          "attended a sporting event", "went on a trip (e.g., vacation or weekend)",
          "exercised (e.g., jogging, aerobics)", "cleaned house/apartment",
          "went on an outing (e.g. picnic, beach, zoo, winter carnival)",
          "went to church/religious function", "wilderness activity (e.g., hunting, hiking, fishing)",
          "worked on homework", "went to a concert", "engaged in sexual relations", "went dancing",
          "discussed things of a non-personal nature", "went to a party", "went to a clothing store",
          "played music/sang"
        ];

        const INFLUENCE_QUESTIONS = [
          "1. SP will influence my future financial security.",
          "2. SP does not influence everyday things in my life.",
          "3. SP influences important things in my life.",
          "4. SP influences which parties and other social events I attend.",
          "5. SP influences the extent to which I accept responsibilities in our relationship.",
          "6. SP does not influence how much time I spend doing household work.",
          "7. SP does not influence how I choose to spend my money.",
          "8. SP influences the way I feel about myself.",
          "9. SP does not influence my moods.",
          "10. SP influences the basic values that I hold.",
          "11. SP does not influence the opinions that I have of other important people in my life.",
          "12. SP does not influence when I see, and the amount of time I spend with, my family.",
          "13. SP influences when I see, and the amount of time I spend with, my friends.",
          "14. SP does not influence which of my friends I see.",
          "15. SP does not influence the type of career I have/will have.",
          "16. SP influences or will influence how much time I devote to my career.",
          "17. SP does not influence my chances of getting a good job in the future.",
          "18. SP influences the way I feel about the future.",
          "19. SP does not have the capacity to influence how I act in various situations.",
          "20. SP influences and contributes to my overall happiness.",
          "21. SP does not influence my present financial security.",
          "22. SP influences how I spend my free time.",
          "23. SP influences when I see SP and the amount of time the two of us spend together.",
          "24. SP does not influence how I dress.",
          "25. SP influences how I decorate my home (e.g. dorm room, apartment, house).",
          "26. SP does not influence where I live.",
          "27. SP influences what I watch on T.V."
        ];

        const REVERSE_SCORED_INFLUENCE = [2, 6, 7, 9, 11, 12, 14, 15, 17, 19, 21, 24, 26];

        const FUTURE_PLANS_QUESTIONS = [
          "1. my vacation plans",
          "2. my plans to have children",
          "3. my plans to make major investments (house, car, etc.)",
          "4. my plans to join a club, social organization, church, etc.",
          "5. my school-related plans",
          "6. my plans for achieving a particular financial standard of living",
          "7. my plans for changing my current living arrangements" 
        ];

        // --- SCORING LOGIC ---
        const calculateFrequencyScore = (minutes) => {
          if (minutes <= 12) return 1;
          if (minutes <= 48) return 2;
          if (minutes <= 108) return 3;
          if (minutes <= 192) return 4;
          if (minutes <= 300) return 5;
          if (minutes <= 432) return 6;
          if (minutes <= 588) return 7;
          if (minutes <= 768) return 8;
          if (minutes <= 972) return 9;
          return 10;
        };

        const calculateDiversityScore = (count) => {
          if (count === 0) return 1;
          if (count === 1) return 2;
          if (count <= 3) return 3;
          if (count <= 6) return 4;
          if (count <= 9) return 5;
          if (count <= 13) return 6;
          if (count <= 18) return 7;
          if (count <= 24) return 8;
          if (count <= 30) return 9;
          return 10;
        };

        const calculateStrengthScore = (rawScore) => {
          if (rawScore <= 53) return 1;
          if (rawScore <= 73) return 2;
          if (rawScore <= 93) return 3;
          if (rawScore <= 113) return 4;
          if (rawScore <= 133) return 5;
          if (rawScore <= 153) return 6;
          if (rawScore <= 173) return 7;
          if (rawScore <= 193) return 8;
          if (rawScore <= 213) return 9;
          return 10;
        };

        function App() {
          const [step, setStep] = useState(0); 
          const [partnerName, setPartnerName] = useState('');
          const [timeData, setTimeData] = useState({
            morningHr: '', morningMin: '',
            afternoonHr: '', afternoonMin: '',
            eveningHr: '', eveningMin: '',
            typical: null, typicalExplanation: ''
          });
          const [selectedActivities, setSelectedActivities] = useState(new Set());
          const [influenceScores, setInfluenceScores] = useState({});
          const [futureScores, setFutureScores] = useState({});
          const [errorMsg, setErrorMsg] = useState("");

          useEffect(() => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setErrorMsg(""); 
          }, [step]);

          const handleTimeChange = (field, value) => {
            let num = parseInt(value, 10);
            if (isNaN(num)) num = '';
            if (num < 0) num = 0;
            if (field.includes('Min') && num > 59) num = 59;
            if (field.includes('Hr') && num > 12) num = 12;
            setTimeData(prev => ({ ...prev, [field]: num }));
          };

          const toggleActivity = (index) => {
            const newSet = new Set(selectedActivities);
            if (newSet.has(index)) {
              newSet.delete(index);
            } else {
              newSet.add(index);
            }
            setSelectedActivities(newSet);
          };

          const validateStep = () => {
            if (step === 1) {
              if (timeData.typical === null) {
                setErrorMsg("Please select if the week was typical.");
                return false;
              }
              if (timeData.typical === false && timeData.typicalExplanation.trim() === '') {
                setErrorMsg("Please explain why the week was not typical.");
                return false;
              }
            } else if (step === 3) {
              for (let i = 0; i < 14; i++) {
                if (!influenceScores[i]) {
                  setErrorMsg("Please answer all questions before proceeding.");
                  return false;
                }
              }
            } else if (step === 4) {
              for (let i = 14; i < 27; i++) {
                if (!influenceScores[i]) {
                  setErrorMsg("Please answer all questions before proceeding.");
                  return false;
                }
              }
            } else if (step === 5) {
              for (let i = 0; i < FUTURE_PLANS_QUESTIONS.length; i++) {
                if (!futureScores[i]) {
                  setErrorMsg("Please answer all questions to see your results.");
                  return false;
                }
              }
            }
            return true;
          };

          const handleNext = () => {
            if (validateStep()) {
              setStep(prev => prev + 1);
            }
          };

          const handleBack = () => setStep(prev => prev - 1);

          const capitalize = (s) => s.charAt(0).toUpperCase() + s.slice(1);
          const pName = partnerName.trim() ? capitalize(partnerName.trim()) : 'your partner';
          const pNamePossessive = partnerName.trim() ? `${capitalize(partnerName.trim())}'s` : "your partner's";

          const formatText = (text) => {
            return text.replace(/SP's/g, pNamePossessive).replace(/SP/g, pName);
          };

          const getResults = () => {
            const mHr = parseInt(timeData.morningHr || 0) * 60;
            const mMin = parseInt(timeData.morningMin || 0);
            const aHr = parseInt(timeData.afternoonHr || 0) * 60;
            const aMin = parseInt(timeData.afternoonMin || 0);
            const eHr = parseInt(timeData.eveningHr || 0) * 60;
            const eMin = parseInt(timeData.eveningMin || 0);
            const totalMinutes = mHr + mMin + aHr + aMin + eHr + eMin;
            const frequencyScore = calculateFrequencyScore(totalMinutes);

            const diversityCount = selectedActivities.size;
            const diversityScore = calculateDiversityScore(diversityCount);

            let rawStrengthScore = 0;
            for (let i = 0; i < 27; i++) {
              let val = parseInt(influenceScores[i]);
              let questionNumber = i + 1;
              if (REVERSE_SCORED_INFLUENCE.includes(questionNumber)) {
                val = 8 - val; 
              }
              rawStrengthScore += val;
            }

            for (let i = 0; i < FUTURE_PLANS_QUESTIONS.length; i++) {
              rawStrengthScore += parseInt(futureScores[i]);
            }

            const strengthScore = calculateStrengthScore(rawStrengthScore);

            return {
              totalMinutes, frequencyScore,
              diversityCount, diversityScore,
              rawStrengthScore, strengthScore
            };
          };

          const ProgressBar = () => {
            const steps = [
              { id: 1, icon: IconClock, label: 'Time' },
              { id: 2, icon: IconCheckSquare, label: 'Activities' },
              { id: 3, icon: IconActivity, label: 'Influence I' },
              { id: 4, icon: IconActivity, label: 'Influence II' },
              { id: 5, icon: IconMap, label: 'Future Plans' }
            ];

            if (step === 0 || step === 6) return null;

            return (
              <div className="w-full max-w-4xl mx-auto mb-8 px-4">
                <div className="flex justify-between items-center">
                  {steps.map((s, idx) => (
                    <div key={s.id} className="flex flex-col items-center relative w-full">
                      <div className={`w-10 h-10 rounded-full flex items-center justify-center z-10 transition-colors duration-300 ${
                        step >= s.id ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-400'
                      }`}>
                        <s.icon size={20} />
                      </div>
                      <span className={`text-xs mt-2 font-medium hidden sm:block ${
                        step >= s.id ? 'text-indigo-800' : 'text-gray-400'
                      }`}>{s.label}</span>
                      {idx !== steps.length - 1 && (
                        <div className={`absolute top-5 left-1/2 w-full h-1 -z-0 transition-colors duration-300 ${
                          step > s.id ? 'bg-indigo-600' : 'bg-gray-200'
                        }`} />
                      )}
                    </div>
                  ))}
                </div>
              </div>
            );
          };

          const renderStep1 = () => (
            <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
              <h2 className="text-2xl font-bold text-gray-800 mb-2">Time Spent Together</h2>
              <p className="text-gray-600 mb-6">Estimate the average amount of time, per day, that you spent alone with <b>{pName}</b>, with no one else around, over the past week.</p>
              
              <div className="space-y-6">
                {['morning', 'afternoon', 'evening'].map((period) => (
                  <div key={period} className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div className="w-full sm:w-1/3">
                      <h3 className="text-lg font-semibold text-gray-700 capitalize">{period}</h3>
                      <p className="text-sm text-gray-500">
                        {period === 'morning' && '(e.g. waking up to 12 noon)'}
                        {period === 'afternoon' && '(e.g. 12 noon to 6 PM)'}
                        {period === 'evening' && '(e.g. 6 PM to bedtime)'}
                      </p>
                    </div>
                    <div className="flex gap-4 w-full sm:w-auto">
                      <div className="flex flex-col">
                        <label className="text-xs text-gray-500 mb-1 font-medium">Hours</label>
                        <input type="number" min="0" max="12" placeholder="0"
                          className="w-20 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                          value={timeData[`${period}Hr`]} onChange={(e) => handleTimeChange(`${period}Hr`, e.target.value)} />
                      </div>
                      <div className="flex flex-col">
                        <label className="text-xs text-gray-500 mb-1 font-medium">Minutes</label>
                        <input type="number" min="0" max="59" placeholder="0"
                          className="w-20 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                          value={timeData[`${period}Min`]} onChange={(e) => handleTimeChange(`${period}Min`, e.target.value)} />
                      </div>
                    </div>
                  </div>
                ))}

                <div className="bg-indigo-50 p-6 rounded-xl border border-indigo-100 mt-8">
                  <h3 className="text-lg font-semibold text-indigo-900 mb-4">How typical was the past week compared to normal?</h3>
                  <div className="flex flex-col gap-4">
                    <label className="flex items-center gap-3 cursor-pointer">
                      <input type="radio" name="typical" checked={timeData.typical === true} onChange={() => setTimeData(prev => ({...prev, typical: true}))} className="w-5 h-5 text-indigo-600" />
                      <span className="text-gray-700 font-medium">Typical</span>
                    </label>
                    <label className="flex items-center gap-3 cursor-pointer">
                      <input type="radio" name="typical" checked={timeData.typical === false} onChange={() => setTimeData(prev => ({...prev, typical: false}))} className="w-5 h-5 text-indigo-600" />
                      <span className="text-gray-700 font-medium">Not typical</span>
                    </label>
                    {timeData.typical === false && (
                      <textarea placeholder="Please explain why..."
                        className="w-full mt-2 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                        rows="3" value={timeData.typicalExplanation} onChange={(e) => setTimeData(prev => ({...prev, typicalExplanation: e.target.value}))} />
                    )}
                  </div>
                </div>
              </div>
            </div>
          );

          const renderStep2 = () => (
            <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
              <h2 className="text-2xl font-bold text-gray-800 mb-2">Shared Activities</h2>
              <p className="text-gray-600 mb-6">Check all activities that you have engaged in <b>alone</b> with <b>{pName}</b> in the past week (not in the presence of others).</p>
              
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                {ACTIVITIES.map((activity, idx) => (
                  <label key={idx} className={`flex items-start gap-3 p-4 rounded-xl border cursor-pointer transition-all ${selectedActivities.has(idx) ? 'bg-indigo-50 border-indigo-500 ring-1 ring-indigo-500' : 'bg-white border-gray-200 hover:border-indigo-300'}`}>
                    <div className="mt-1 flex-shrink-0">
                      <input type="checkbox" checked={selectedActivities.has(idx)} onChange={() => toggleActivity(idx)} className="w-5 h-5 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" />
                    </div>
                    <span className={`text-sm ${selectedActivities.has(idx) ? 'text-indigo-900 font-medium' : 'text-gray-700'}`}>{activity}</span>
                  </label>
                ))}
              </div>
            </div>
          );

          const renderScaleQuestion = (itemText, index, stateObj, setStateFn) => (
            <div key={index} className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 mb-4 hover:border-indigo-200 transition-colors">
              <p className="text-gray-800 font-medium mb-4">{itemText}</p>
              <div className="flex flex-col sm:flex-row justify-between items-center gap-4">
                <span className="text-xs text-gray-400 font-semibold uppercase tracking-wider hidden sm:block w-24 text-right">Strongly Disagree</span>
                
                <div className="flex gap-2 sm:gap-4 w-full sm:w-auto justify-between">
                  {[1, 2, 3, 4, 5, 6, 7].map(num => (
                    <label key={num} className="flex flex-col items-center gap-1 cursor-pointer group">
                      <input type="radio" name={`q-${index}`} value={num}
                        checked={stateObj[index] === num}
                        onChange={() => setStateFn(prev => ({ ...prev, [index]: num }))}
                        className="sr-only" />
                      <div className={`w-8 h-8 sm:w-10 sm:h-10 rounded-full flex items-center justify-center font-bold text-sm transition-all duration-200 ${
                        stateObj[index] === num 
                          ? 'bg-indigo-600 text-white shadow-md transform scale-110' 
                          : 'bg-gray-100 text-gray-500 group-hover:bg-indigo-100 group-hover:text-indigo-600'
                      }`}>
                        {num}
                      </div>
                    </label>
                  ))}
                </div>
                
                <span className="text-xs text-gray-400 font-semibold uppercase tracking-wider hidden sm:block w-24">Strongly Agree</span>
              </div>
              <div className="flex justify-between sm:hidden mt-2">
                 <span className="text-xs text-gray-400 font-semibold">Disagree</span>
                 <span className="text-xs text-gray-400 font-semibold">Agree</span>
              </div>
            </div>
          );

          const renderStep3 = () => (
            <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
              <h2 className="text-2xl font-bold text-gray-800 mb-2">Amount of Influence (Part 1)</h2>
              <p className="text-gray-600 mb-6">Indicate the extent to which you agree or disagree with each statement regarding <b>{pNamePossessive}</b> influence on your thoughts, feelings, and behavior.</p>
              <div className="space-y-2">
                {INFLUENCE_QUESTIONS.slice(0, 14).map((q, idx) => renderScaleQuestion(formatText(q), idx, influenceScores, setInfluenceScores))}
              </div>
            </div>
          );

          const renderStep4 = () => (
            <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
              <h2 className="text-2xl font-bold text-gray-800 mb-2">Amount of Influence (Part 2)</h2>
              <p className="text-gray-600 mb-6">Continue indicating the extent to which you agree or disagree with each statement.</p>
              <div className="space-y-2">
                {INFLUENCE_QUESTIONS.slice(14, 27).map((q, idx) => renderScaleQuestion(formatText(q), idx + 14, influenceScores, setInfluenceScores))}
              </div>
            </div>
          );

          const renderStep5 = () => (
            <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
              <h2 className="text-2xl font-bold text-gray-800 mb-2">Future Plans & Goals</h2>
              <p className="text-gray-600 mb-6">How much does <b>{pName}</b> affect your future plans and goals? (1 = Not at all, 7 = A great extent)</p>
              <div className="space-y-2">
                {FUTURE_PLANS_QUESTIONS.map((q, idx) => renderScaleQuestion(q, idx, futureScores, setFutureScores))}
              </div>
            </div>
          );

          const renderStep6 = () => {
            const results = getResults();
            
            const chartData = [
              { subject: 'Time (Frequency)', A: results.frequencyScore, fullMark: 10 },
              { subject: 'Activities (Diversity)', A: results.diversityScore, fullMark: 10 },
              { subject: 'Influence (Strength)', A: results.strengthScore, fullMark: 10 }
            ];

            return (
              <div className="animate-in fade-in zoom-in-95 duration-700 bg-white p-8 rounded-2xl shadow-xl border border-indigo-50">
                <div className="text-center mb-10">
                  <div className="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 rounded-full text-indigo-600 mb-4">
                    <IconBarChart2 size={32} />
                  </div>
                  <h2 className="text-4xl font-extrabold text-gray-900 tracking-tight">Your RCI Profile</h2>
                  <p className="text-gray-500 mt-2 text-lg">A statistical breakdown of your Relationship Closeness Inventory</p>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                  
                  <div className="h-80 w-full bg-slate-50 rounded-xl p-4">
                    <ResponsiveContainer width="100%" height="100%">
                      <RadarChart cx="50%" cy="50%" outerRadius="80%" data={chartData}>
                        <PolarGrid stroke="#e2e8f0" />
                        <PolarAngleAxis dataKey="subject" tick={{ fill: '#475569', fontSize: 13, fontWeight: 600 }} />
                        <PolarRadiusAxis angle={30} domain={[0, 10]} tick={{ fill: '#94a3b8' }} />
                        <Radar name="Your Score" dataKey="A" stroke="#4f46e5" strokeWidth={3} fill="#4f46e5" fillOpacity={0.4} />
                        <Tooltip wrapperClassName="rounded-lg shadow-lg" />
                      </RadarChart>
                    </ResponsiveContainer>
                  </div>

                  <div className="space-y-6">
                    <div className="bg-white p-5 rounded-xl border border-gray-100 shadow-sm flex items-center gap-4">
                      <div className="w-14 h-14 bg-blue-100 text-blue-600 rounded-full flex justify-center items-center font-bold text-xl flex-shrink-0">
                        {results.frequencyScore}/10
                      </div>
                      <div>
                        <h4 className="font-bold text-gray-800 text-lg">Frequency (Time)</h4>
                        <p className="text-sm text-gray-500">You spend an average of <span className="font-semibold text-gray-700">{Math.round(results.totalMinutes / 60)}h {results.totalMinutes % 60}m</span> per day alone together.</p>
                      </div>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-gray-100 shadow-sm flex items-center gap-4">
                      <div className="w-14 h-14 bg-green-100 text-green-600 rounded-full flex justify-center items-center font-bold text-xl flex-shrink-0">
                        {results.diversityScore}/10
                      </div>
                      <div>
                        <h4 className="font-bold text-gray-800 text-lg">Diversity (Activities)</h4>
                        <p className="text-sm text-gray-500">You engage in <span className="font-semibold text-gray-700">{results.diversityCount}</span> distinct types of activities together per week.</p>
                      </div>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-gray-100 shadow-sm flex items-center gap-4">
                      <div className="w-14 h-14 bg-rose-100 text-rose-600 rounded-full flex justify-center items-center font-bold text-xl flex-shrink-0">
                        {results.strengthScore}/10
                      </div>
                      <div>
                        <h4 className="font-bold text-gray-800 text-lg">Strength (Influence)</h4>
                        <p className="text-sm text-gray-500">Scored <span className="font-semibold text-gray-700">{results.rawStrengthScore}</span> raw points indicating the degree of cognitive and emotional influence <b>{pName}</b> has on you.</p>
                      </div>
                    </div>
                    
                    <div className="mt-8 p-4 bg-indigo-50 text-indigo-900 rounded-lg text-sm leading-relaxed border border-indigo-100">
                      <b>Understanding your scores:</b> The scale ranges from 1-10 based on standard normative data. A well-rounded polygon on the radar chart indicates a balanced relationship structure across time spent, shared activities, and mutual influence.
                    </div>
                    
                    <button onClick={() => { setStep(0); setPartnerName(''); setTimeData({morningHr:'',morningMin:'',afternoonHr:'',afternoonMin:'',eveningHr:'',eveningMin:'',typical:null,typicalExplanation:''}); setSelectedActivities(new Set()); setInfluenceScores({}); setFutureScores({}); }} 
                      className="mt-4 w-full py-3 px-6 bg-gray-100 text-gray-700 rounded-xl font-bold hover:bg-gray-200 transition-colors">
                      Retake Assessment
                    </button>
                  </div>
                </div>
              </div>
            );
          };

          return (
            <div className="min-h-screen p-4 sm:p-8">
              <div className="max-w-4xl mx-auto">
                
                {step === 0 && (
                  <div className="flex flex-col items-center justify-center min-h-[80vh] text-center px-4 animate-in fade-in duration-700">
                    <div className="w-24 h-24 bg-indigo-600 text-white rounded-full flex items-center justify-center mb-8 shadow-xl shadow-indigo-200">
                       <IconActivity size={48} />
                    </div>
                    <h1 className="text-4xl sm:text-5xl font-extrabold text-gray-900 tracking-tight mb-6">Relationship Closeness Inventory</h1>
                    <p className="text-lg text-gray-600 max-w-2xl mb-10 leading-relaxed">
                      This psychological assessment measures the interdependence in your relationship across three dimensions: the amount of time spent together, the diversity of your shared activities, and the strength of influence your partner has on your decisions.
                    </p>
                    
                    <div className="mb-10 w-full max-w-md mx-auto text-left bg-white p-6 rounded-2xl shadow-sm border border-indigo-50">
                      <label className="block text-sm font-bold text-gray-700 mb-3 text-center">To personalize your experience, what is your partner's name?</label>
                      <input
                        type="text"
                        value={partnerName}
                        onChange={(e) => setPartnerName(e.target.value)}
                        placeholder="Enter their name (e.g., Alex)"
                        className="w-full p-4 border-2 border-indigo-100 rounded-xl focus:border-indigo-500 focus:ring-0 transition-colors outline-none text-center text-lg font-medium"
                        onKeyDown={(e) => e.key === 'Enter' && partnerName.trim() && setStep(1)}
                      />
                    </div>

                    <button 
                      onClick={() => setStep(1)}
                      disabled={!partnerName.trim()}
                      className={`group relative inline-flex items-center justify-center px-8 py-4 font-bold text-white transition-all duration-200 font-pj rounded-xl shadow-lg ${
                        partnerName.trim() 
                          ? 'bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-600' 
                          : 'bg-gray-300 cursor-not-allowed'
                      }`}
                    >
                      Start Assessment
                      <IconChevronRight className="ml-2 group-hover:translate-x-1 transition-transform" />
                    </button>
                  </div>
                )}

                {step > 0 && step < 6 && (
                  <>
                    <ProgressBar />
                    
                    <div className="bg-white rounded-2xl shadow-xl shadow-slate-200/50 p-6 sm:p-10 border border-slate-100">
                      
                      {errorMsg && (
                        <div className="mb-6 p-4 bg-red-50 text-red-700 rounded-lg flex items-center gap-3 border border-red-100 animate-in shake">
                          <IconShieldAlert size={20} />
                          <span className="font-medium text-sm">{errorMsg}</span>
                        </div>
                      )}

                      {step === 1 && renderStep1()}
                      {step === 2 && renderStep2()}
                      {step === 3 && renderStep3()}
                      {step === 4 && renderStep4()}
                      {step === 5 && renderStep5()}

                      <div className="mt-10 pt-6 border-t border-gray-100 flex justify-between items-center">
                        <button 
                          onClick={handleBack}
                          className={`flex items-center px-5 py-3 rounded-xl font-medium transition-colors ${step === 1 ? 'invisible' : 'text-gray-500 hover:bg-gray-100'}`}
                        >
                          <IconChevronLeft size={20} className="mr-1" /> Back
                        </button>
                        
                        <button 
                          onClick={handleNext}
                          className="flex items-center px-8 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-colors shadow-md shadow-indigo-200"
                        >
                          {step === 5 ? 'See Results' : 'Next Step'} <IconChevronRight size={20} className="ml-1" />
                        </button>
                      </div>
                    </div>
                  </>
                )}

                {step === 6 && renderStep6()}

              </div>
            </div>
          );
        }

        // Render the app to the DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
